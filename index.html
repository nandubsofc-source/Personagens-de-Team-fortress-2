<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TF2 Mercenaries</title>


<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


body {

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background: #111;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   TELA PRINCIPAL
===================================================== */

.screen {

    position: relative;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background: #111;

}


/* =====================================================
   IMAGEM DE FUNDO
===================================================== */

.background-character {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center top;

    transition:

        opacity .5s ease,

        transform .8s ease;

    transform: scale(1.02);

}


/* =====================================================
   SOMBRAS SOBRE A IMAGEM

   Isso é o que vai dar o efeito parecido
   com uma tela cinematográfica.
===================================================== */

.shadow {

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        linear-gradient(
            90deg,

            rgba(0,0,0,.95) 0%,

            rgba(0,0,0,.75) 18%,

            rgba(0,0,0,.35) 40%,

            rgba(0,0,0,.08) 65%,

            rgba(0,0,0,.55) 100%
        );

}


/* sombra embaixo */

.shadow-bottom {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 45%;

    z-index: 3;

    pointer-events: none;

    background:

        linear-gradient(
            transparent,
            rgba(0,0,0,.95)
        );

}


/* =====================================================
   MENU LATERAL
===================================================== */

.class-menu {

    position: absolute;

    left: 35px;

    top: 50%;

    transform:
        translateY(-50%);

    z-index: 10;

    display: flex;

    flex-direction: column;

    gap: 12px;

}


/* =====================================================
   ÍCONE DO PERSONAGEM
===================================================== */

.class-button {

    position: relative;

    width: 62px;

    height: 62px;

    border-radius: 50%;

    border:

        2px solid
        rgba(255,255,255,.35);

    background:

        rgba(15,15,15,.65);

    backdrop-filter:
        blur(5px);

    cursor: pointer;

    overflow: hidden;

    transition:

        transform .2s,

        border .2s,

        background .2s,

        box-shadow .2s;

}


/* imagem dentro da bolinha */

.class-button img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* passar mouse */

.class-button:hover {

    transform:
        scale(1.15);

    border-color:
        white;

    background:
        rgba(255,255,255,.15);

}


/* selecionado */

.class-button.active {

    border:

        3px solid
        #d5a64d;

    box-shadow:

        0 0 20px
        rgba(213,166,77,.7);

    transform:
        scale(1.12);

}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.info {

    position: absolute;

    left: 140px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 480px;

    z-index: 5;

}


/* classe */

.class-type {

    color:
        #d5a64d;

    font-size:
        16px;

    font-weight:
        bold;

    letter-spacing:
        5px;

    text-transform:
        uppercase;

    margin-bottom:
        10px;

}


/* nome */

.character-name {

    font-size:
        clamp(60px, 7vw, 110px);

    line-height:
        .85;

    font-weight:
        900;

    letter-spacing:
        3px;

    text-transform:
        uppercase;

    text-shadow:

        4px 5px 0
        rgba(0,0,0,.6);

}


/* subtítulo */

.character-role {

    margin-top:
        15px;

    color:
        #ddd;

    font-size:
        18px;

    font-weight:
        bold;

    text-transform:
        uppercase;

    letter-spacing:
        2px;

}


/* linha */

.line {

    width:
        350px;

    height:
        2px;

    margin:
        25px 0;

    background:

        linear-gradient(
            90deg,
            #d5a64d,
            transparent
        );

}


/* descrição */

.description {

    color:
        #ddd;

    font-size:
        16px;

    line-height:
        1.7;

    max-width:
        450px;

}


/* =====================================================
   INFORMAÇÕES INFERIORES
===================================================== */

.stats {

    display:
        flex;

    gap:
        35px;

    margin-top:
        30px;

}


.stat {

    display:
        flex;

    flex-direction:
        column;

}


.stat-title {

    color:
        #999;

    font-size:
        10px;

    letter-spacing:
        2px;

    margin-bottom:
        5px;

}


.stat-value {

    font-size:
        17px;

    font-weight:
        bold;

}


/* =====================================================
   NOME DO SITE
===================================================== */

.logo {

    position:
        absolute;

    left:
        40px;

    top:
        30px;

    z-index:
        20;

    font-size:
        16px;

    font-weight:
        bold;

    letter-spacing:
        4px;

    color:
        #ddd;

}


/* =====================================================
   BOTÃO / INDICAÇÃO
===================================================== */

.select-text {

    position:
        absolute;

    right:
        40px;

    bottom:
        35px;

    z-index:
        10;

    color:
        rgba(255,255,255,.5);

    font-size:
        11px;

    letter-spacing:
        2px;

}


/* =====================================================
   ANIMAÇÃO
===================================================== */

.info.animate {

    animation:
        infoEnter .45s ease;

}


.background-character.animate {

    animation:
        backgroundEnter .7s ease;

}


@keyframes infoEnter {

    from {

        opacity:
            0;

        transform:
            translateY(-50%)
            translateX(-30px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(-50%)
            translateX(0);

    }

}


@keyframes backgroundEnter {

    from {

        opacity:
            .2;

        transform:
            scale(1.08);

    }

    to {

        opacity:
            1;

        transform:
            scale(1.02);

    }

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width: 800px) {


    .class-menu {

        left:
            15px;

        top:
            40%;

        gap:
            8px;

    }


    .class-button {

        width:
            45px;

        height:
            45px;

    }


    .info {

        left:
            80px;

        right:
            20px;

        width:
            auto;

    }


    .character-name {

        font-size:
            55px;

    }


    .description {

        font-size:
            13px;

    }


    .stats {

        gap:
            15px;

    }


    .shadow {

        background:

            linear-gradient(
                90deg,
                rgba(0,0,0,.9),
                rgba(0,0,0,.45),
                rgba(0,0,0,.5)
            );

    }

}


</style>

</head>



<body>


<div class="screen">


    <!-- =================================================
         LOGO
    ================================================== -->

    <div class="logo">

        TEAM FORTRESS 2

    </div>



    <!-- =================================================
         IMAGEM GRANDE
    ================================================== -->

    <img
        id="backgroundCharacter"

        class="background-character"

        src="images/scout.png"

        alt="Scout"
    >



    <!-- =================================================
         SOMBRAS
    ================================================== -->

    <div class="shadow"></div>

    <div class="shadow-bottom"></div>



    <!-- =================================================
         MENU DOS PERSONAGENS
    ================================================== -->

    <div class="class-menu">


        <button
            class="class-button active"
            data-character="scout"
        >

            <img
                src="images/scout.png"
                alt="Scout"
            >

        </button>



        <button
            class="class-button"
            data-character="soldier"
        >

            <img
                src="images/soldier.png"
                alt="Soldier"
            >

        </button>



        <button
            class="class-button"
            data-character="pyro"
        >

            <img
                src="images/pyro.png"
                alt="Pyro"
            >

        </button>



        <button
            class="class-button"
            data-character="demoman"
        >

            <img
                src="images/demoman.png"
                alt="Demoman"
            >

        </button>



        <button
            class="class-button"
            data-character="heavy"
        >

            <img
                src="images/heavy.png"
                alt="Heavy"
            >

        </button>



        <button
            class="class-button"
            data-character="engineer"
        >

            <img
                src="images/engineer.png"
                alt="Engineer"
            >

        </button>



        <button
            class="class-button"
            data-character="medic"
        >

            <img
                src="images/medic.png"
                alt="Medic"
            >

        </button>



        <button
            class="class-button"
            data-character="sniper"
        >

            <img
                src="images/sniper.png"
                alt="Sniper"
            >

        </button>



        <button
            class="class-button"
            data-character="spy"
        >

            <img
                src="images/spy.png"
                alt="Spy"
            >

        </button>


    </div>



    <!-- =================================================
         INFORMAÇÕES
    ================================================== -->

    <div class="info" id="info">


        <div
            class="class-type"
            id="classType"
        >

            OFFENSE

        </div>


        <h1
            class="character-name"
            id="characterName"
        >

            SCOUT

        </h1>


        <div
            class="character-role"
            id="characterRole"
        >

            OFENSIVA

        </div>


        <div class="line"></div>


        <p
            class="description"
            id="description"
        >

            Extremamente rápido e ágil.
            O Scout é especialista em capturar
            objetivos rapidamente e dominar o
            campo de batalha através de sua
            velocidade.

        </p>



        <!-- ESTATÍSTICAS -->

        <div class="stats">


            <div class="stat">

                <span class="stat-title">
                    VIDA
                </span>

                <span
                    class="stat-value"
                    id="health"
                >
                    125
                </span>

            </div>



            <div class="stat">

                <span class="stat-title">
                    VELOCIDADE
                </span>

                <span
                    class="stat-value"
                    id="speed"
                >
                    133%
                </span>

            </div>



            <div class="stat">

                <span class="stat-title">
                    ARMA
                </span>

                <span
                    class="stat-value"
                    id="weapon"
                >
                    SCATTERGUN
                </span>

            </div>


        </div>


    </div>



    <div class="select-text">

        PASSE O MOUSE SOBRE UM MERCENÁRIO

    </div>


</div>



<script>

/* =====================================================
   DADOS
===================================================== */

const characters = {


    scout: {

        name: "SCOUT",

        type: "OFFENSE",

        role: "OFENSIVA",

        image: "images/scout.png",

        health: "125",

        speed: "133%",

        weapon: "SCATTERGUN",

        description:
        "Extremamente rápido e ágil. O Scout é especialista em capturar objetivos rapidamente e dominar o campo de batalha através de sua velocidade."

    },


    soldier: {

        name: "SOLDIER",

        type: "OFFENSE",

        role: "OFENSIVA",

        image: "images/soldier.png",

        health: "200",

        speed: "80%",

        weapon: "ROCKET LAUNCHER",

        description:
        "Um combatente extremamente versátil equipado com um poderoso lança-foguetes."

    },


    pyro: {

        name: "PYRO",

        type: "OFFENSE",

        role: "OFENSIVA",

        image: "images/pyro.png",

        health: "175",

        speed: "100%",

        weapon: "FLAMETHROWER",

        description:
        "Especialista em combate de curta distância utilizando seu poderoso lança-chamas."

    },


    demoman: {

        name: "DEMOMAN",

        type: "DEFENSE",

        role: "DEFESA",

        image: "images/demoman.png",

        health: "175",

        speed: "93%",

        weapon: "GRENADE LAUNCHER",

        description:
        "Especialista em explosivos capaz de controlar áreas inteiras do campo de batalha."

    },


    heavy: {

        name: "HEAVY",

        type: "DEFENSE",

        role: "DEFESA",

        image: "images/heavy.png",

        health: "300",

        speed: "77%",

        weapon: "MINIGUN",

        description:
        "O mercenário mais resistente da equipe. Sua Minigun causa enorme quantidade de dano."

    },


    engineer: {

        name: "ENGINEER",

        type: "DEFENSE",

        role: "DEFESA",

        image: "images/engineer.png",

        health: "125",

        speed: "100%",

        weapon: "SHOTGUN",

        description:
        "Constrói sentinelas, dispensers e teleporters para ajudar sua equipe."

    },


    medic: {

        name: "MEDIC",

        type: "SUPPORT",

        role: "SUPORTE",

        image: "images/medic.png",

        health: "150",

        speed: "107%",

        weapon: "MEDIGUN",

        description:
        "Responsável por manter seus companheiros vivos e ativar poderosas ÜberCharges."

    },


    sniper: {

        name: "SNIPER",

        type: "SUPPORT",

        role: "SUPORTE",

        image: "images/sniper.png",

        health: "125",

        speed: "100%",

        weapon: "SNIPER RIFLE",

        description:
        "Especialista em eliminar inimigos de longa distância com extrema precisão."

    },


    spy: {

        name: "SPY",

        type: "SUPPORT",

        role: "SUPORTE",

        image: "images/spy.png",

        health: "125",

        speed: "107%",

        weapon: "REVOLVER",

        description:
        "Mestre da infiltração, capaz de usar disfarces e invisibilidade para surpreender inimigos."

    }

};



/* =====================================================
   ELEMENTOS
===================================================== */

const buttons =
    document.querySelectorAll(
        ".class-button"
    );


const background =
    document.getElementById(
        "backgroundCharacter"
    );


const info =
    document.getElementById(
        "info"
    );


const classType =
    document.getElementById(
        "classType"
    );


const characterName =
    document.getElementById(
        "characterName"
    );


const characterRole =
    document.getElementById(
        "characterRole"
    );


const description =
    document.getElementById(
        "description"
    );


const health =
    document.getElementById(
        "health"
    );


const speed =
    document.getElementById(
        "speed"
    );


const weapon =
    document.getElementById(
        "weapon"
    );



/* =====================================================
   SELECIONAR PERSONAGEM
===================================================== */

function selectCharacter(id) {


    const character =
        characters[id];


    if (!character) {

        return;

    }


    /* imagem */

    background.style.opacity = "0";


    setTimeout(() => {

        background.src =
            character.image;

        background.alt =
            character.name;

        background.style.opacity = "1";

    }, 150);



    /* informações */

    classType.textContent =
        character.type;


    characterName.textContent =
        character.name;


    characterRole.textContent =
        character.role;


    description.textContent =
        character.description;


    health.textContent =
        character.health;


    speed.textContent =
        character.speed;


    weapon.textContent =
        character.weapon;



    /* botão ativo */

    buttons.forEach(
        button => {

            button.classList.remove(
                "active"
            );

        }
    );


    const selected =
        document.querySelector(
            `[data-character="${id}"]`
        );


    if (selected) {

        selected.classList.add(
            "active"
        );

    }



    /* animação */

    info.classList.remove(
        "animate"
    );

    background.classList.remove(
        "animate"
    );


    void info.offsetWidth;


    info.classList.add(
        "animate"
    );

    background.classList.add(
        "animate"
    );

}



/* =====================================================
   MOUSE
===================================================== */

buttons.forEach(
    button => {


        button.addEventListener(
            "mouseenter",
            () => {

                selectCharacter(
                    button.dataset.character
                );

            }
        );


        button.addEventListener(
            "click",
            () => {

                selectCharacter(
                    button.dataset.character
                );

            }
        );


    }
);


</script>


</body>

</html>
